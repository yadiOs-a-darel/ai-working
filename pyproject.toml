[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "1.0.0"
description = "Assistant IA vocal personnel JARVIS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jarvis = "main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "core*", "memory*", "tools*", "agent*", "api*", "ui*"]
